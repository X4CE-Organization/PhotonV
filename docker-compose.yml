services:
  # ---------------------------------------------------------------------------
  # 直播接入：MediaMTX 同时负责接收推流（RTMP / 浏览器 WHIP）与分发播放（WHEP / HLS）
  # 不需要直播可以把这一整段删掉，并在后台把「启用内置推流接入」关掉。
  # 公网部署前记得改 docs/mediamtx.yml 里的 webrtcAdditionalHosts。
  # ---------------------------------------------------------------------------
  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: photonv-live
    restart: unless-stopped
    volumes:
      - ./docs/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - '1935:1935'        # RTMP 推流（OBS）
      - '8888:8888'        # HLS 播放
      - '8889:8889'        # WebRTC：WHIP 推流 + WHEP 播放
      - '8189:8189/udp'    # WebRTC 媒体端口
      - '8554:8554'        # RTSP（可选）
    depends_on:
      - photonv

  redis:
    image: redis:7-alpine
    container_name: photonv-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - photonv-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    container_name: photonv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: photonv
      POSTGRES_USER: photonv
      # 生产环境务必修改
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photonv-change-me}
    volumes:
      - photonv-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photonv -d photonv']
      interval: 10s
      timeout: 5s
      retries: 10

  photonv:
    build:
      context: .
      args:
        # 国内服务器打开这两个参数可以大幅加速构建
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: photonv:latest
    container_name: photonv
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      APP_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      DATABASE_URL: postgresql+psycopg://photonv:${POSTGRES_PASSWORD:-photonv-change-me}@db:5432/photonv
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TRANSCODE_ENABLED: ${TRANSCODE_ENABLED:-true}
      TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
      # CHANGE THIS: openssl rand -hex 48
      SECRET_KEY: ${SECRET_KEY:-please-change-this-to-a-long-random-string}
      # 直播：容器内用服务名访问 MediaMTX，改完重启 photonv 生效
      LIVE_API_URL: ${LIVE_API_URL:-http://mediamtx:9997}
      # 下面几个是给浏览器 / OBS 用的公网地址，按你的域名改
      LIVE_RTMP_SERVER: ${LIVE_RTMP_SERVER:-rtmp://localhost:1935}
      LIVE_WHIP_BASE: ${LIVE_WHIP_BASE:-http://localhost:8889}
      LIVE_WHEP_BASE: ${LIVE_WHEP_BASE:-http://localhost:8889}
      LIVE_HLS_BASE: ${LIVE_HLS_BASE:-http://localhost:8888}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-2048}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-16}
      ROOT_USERNAME: ${ROOT_USERNAME:-root}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-photonv123456}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  photonv-db:
  photonv-redis:
