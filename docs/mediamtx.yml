# ---------------------------------------------------------------------------
# PhotonV 直播接入用的 MediaMTX 配置
#
# 一路直播对应一个路径 live/<串流密钥>，两条推流方式共用它：
#   - OBS 等软件 RTMP 推流   rtmp://<域名>:1935/live  + 串流密钥
#   - 站内浏览器开播 WHIP    http://<域名>:8889/live/<串流密钥>/whip
# 观众端：
#   - WebRTC 播放 WHEP       http://<域名>:8889/live/<串流密钥>/whep
#   - HLS 播放               http://<域名>:8888/live/<串流密钥>/index.m3u8
#
# 鉴权交给 PhotonV 后端，只有拿对串流密钥、且有开播权限的主播才能推流。
# 改了配置记得重启 mediamtx 容器。
# ---------------------------------------------------------------------------

logLevel: info
logDestinations: [stdout]

# 管理 API：只看内网，不要暴露到公网
api: yes
apiAddress: :9997

# 鉴权：POST 到 PhotonV 的 /api/live/mediamtx/auth
# docker-compose 里服务名是 photonv，所以下面这个地址可以直接用
authMethod: http
authHTTPAddress: http://photonv:8080/api/live/mediamtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# --- RTMP：给 OBS / 推流软件用 -------------------------------------------
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"

# --- HLS：兼容性最好的播放方式，延迟 5-15 秒 ------------------------------
hls: yes
hlsAddress: :8888
# lowLatency 会把延迟压到 2-5 秒，实时性要求高就用它
hlsVariant: lowLatency
hlsAlwaysRemux: no
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsAllowOrigin: '*'

# --- WebRTC：浏览器开播（WHIP）与低延迟播放（WHEP） ----------------------
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'
# 公网部署时把域名或公网 IP 填进来，否则浏览器可能拿不到可用的候选地址。
# 例：webrtcAdditionalHosts: [live.example.com]
webrtcAdditionalHosts: []
# 走 UDP 的媒体端口，docker-compose 里要一起映射
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''

# --- 其它协议按需开启 -----------------------------------------------------
rtsp: yes
rtspAddress: :8554
srt: no
srtAddress: :8890

# 录制 / 回放默认关闭，需要的话打开 pathDefaults.record
pathDefaults:
  record: no

paths:
  # 所有 live/<key> 路径都走上面的鉴权，不需要一条条声明
  all_others:
